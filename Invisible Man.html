<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム光学迷彩・透明マント</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #ui-container {
      position: absolute;
      top: 15px;
      z-index: 10;
      text-align: center;
      background: rgba(0, 0, 0, 0.82);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      max-width: 92%;
      width: 600px;
    }
    .mode-switch {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 9px 16px;
      font-size: 14px;
      font-weight: bold;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.active {
      background: #007bff;
      color: white;
      border-color: #00e5ff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }
    button.action-btn {
      background: #28a745;
      color: white;
      border-color: #28a745;
    }
    button.action-btn:hover {
      background: #218838;
    }
    #status {
      font-size: 15px;
      font-weight: bold;
      color: #ffeb3b;
      margin-top: 6px;
    }
    #gauge-container {
      margin-top: 8px;
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    #gauge-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #76ff03);
      transition: width 0.05s linear;
    }
    canvas {
      transform: scaleX(-1);
      width: 100%;
      max-width: 800px;
      height: auto;
      background: #000;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }
    video {
      display: none;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="mode-switch">
      <button id="mode-warp-btn" class="active">① 空間ワープ式（背景保存不要）</button>
      <button id="mode-bg-btn">② スマート背景記憶式（くっきり透過）</button>
      <button id="capture-btn" class="action-btn" style="display:none;">3秒後に背景を撮影</button>
    </div>
    <div id="status">カメラとAIモデルを準備中...</div>
    <div id="gauge-container">
      <div id="gauge-bar"></div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output-canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const statusTxt = document.getElementById('status');
    const gaugeBar = document.getElementById('gauge-bar');
    const modeWarpBtn = document.getElementById('mode-warp-btn');
    const modeBgBtn = document.getElementById('mode-bg-btn');
    const captureBtn = document.getElementById('capture-btn');

    // オフスクリーンキャンバス群
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');

    const warpCanvas = document.createElement('canvas');
    const warpCtx = warpCanvas.getContext('2d');

    const personCanvas = document.createElement('canvas');
    const personCtx = personCanvas.getContext('2d');

    // 縮小マスク解析用キャンバス（64x48で高速に人物の左右端を計算する）
    const GRID_W = 64;
    const GRID_H = 48;
    const smallMaskCanvas = document.createElement('canvas');
    smallMaskCanvas.width = GRID_W;
    smallMaskCanvas.height = GRID_H;
    const smallMaskCtx = smallMaskCanvas.getContext('2d', { willReadFrequently: true });

    let currentMode = 'warp'; // 'warp' または 'smart_bg'
    let bgCaptured = false;
    let isSquarePose = false;
    let detectedFingerPoints = null;
    let latestMask = null;
    let isProcessingAI = false;
    let waveTime = 0;

    let cloakAlpha = 0.0;
    const FADE_IN_SPEED = 0.035;
    const FADE_OUT_SPEED = 0.04;

    // モード切り替え
    modeWarpBtn.addEventListener('click', () => {
      currentMode = 'warp';
      modeWarpBtn.classList.add('active');
      modeBgBtn.classList.remove('active');
      captureBtn.style.display = 'none';
      statusTxt.innerText = "【空間ワープ式】両手の親指と人差し指で「四角形」を作ると周囲の景色が体を貫通します";
    });

    modeBgBtn.addEventListener('click', () => {
      currentMode = 'smart_bg';
      modeBgBtn.classList.add('active');
      modeWarpBtn.classList.remove('active');
      captureBtn.style.display = 'inline-block';
      if (!bgCaptured) {
        // まだ撮影していない場合は一旦現在の映像を入れておく
        bgCtx.drawImage(video, 0, 0, bgCanvas.width, bgCanvas.height);
        statusTxt.innerText = "一度画面から外れて「3秒後に背景を撮影」を押すと、真後ろの背景が完璧に透けます";
      }
    });

    // 3秒カウントダウン付き背景撮影
    captureBtn.addEventListener('click', () => {
      let count = 3;
      captureBtn.disabled = true;
      const timer = setInterval(() => {
        if (count > 0) {
          statusTxt.innerText = `📸 背景撮影まで あと ${count} 秒...（カメラの前から避けてください）`;
          count--;
        } else {
          clearInterval(timer);
          bgCtx.drawImage(video, 0, 0, bgCanvas.width, bgCanvas.height);
          bgCaptured = true;
          captureBtn.disabled = false;
          captureBtn.innerText = "背景を撮り直す(3秒)";
          statusTxt.innerText = "✅ 背景を記憶しました！前に立って「四角形」ポーズをとってください";
        }
      }, 1000);
    });

    function getDistance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 1. MediaPipe 人物セグメンテーション
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });
    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults((results) => {
      latestMask = results.segmentationMask;
    });

    // 2. MediaPipe 手の骨格検出
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults((results) => {
      isSquarePose = false;
      detectedFingerPoints = null;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
        const h1 = results.multiHandLandmarks[0];
        const h2 = results.multiHandLandmarks[1];

        // 親指の先(4)または第1関節(3) と 人差し指の先(8) の距離を計算
        const cross1 = getDistance(h1[4], h2[8]);
        const cross2 = getDistance(h1[8], h2[4]);
        const para1 = getDistance(h1[4], h2[4]);
        const para2 = getDistance(h1[8], h2[8]);

        // 認識しやすいよう判定距離を 0.16 に拡大
        const threshold = 0.16;

        if ((cross1 < threshold && cross2 < threshold) ||
            (para1 < threshold && para2 < threshold)) {
          isSquarePose = true;
        }

        // 画面上に視覚ガイドを出すために4点の座標を保存
        detectedFingerPoints = [h1[4], h1[8], h2[4], h2[8]];
      }
    });

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
        });
        video.srcObject = stream;
        await video.play();

        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        [canvas, bgCanvas, warpCanvas, personCanvas].forEach(c => {
          c.width = vw;
          c.height = vh;
        });

        statusTxt.innerText = "AIモデルを準備しています...";
        await selfieSegmentation.send({ image: video });
        await hands.send({ image: video });

        statusTxt.innerText = "準備完了！両手の親指と人差し指で「四角形」を作ると透明化します";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusTxt.style.color = "#ff5252";
        statusTxt.innerHTML = `エラー: ${err.name} - ${err.message}`;
      }
    }

    // 【モード①用】人物の左右にあるリアルタイム背景を引き伸ばして人物領域を埋める関数
    function generateRealtimeWarpBg(vw, vh, maskData) {
      warpCtx.drawImage(video, 0, 0, vw, vh);
      const scaleX = vw / GRID_W;
      const scaleY = vh / GRID_H;

      for (let gy = 0; gy < GRID_H; gy++) {
        // この高さ(行)における人物の左端(minX)と右端(maxX)を探す
        let minX = GRID_W;
        let maxX = -1;
        for (let gx = 0; gx < GRID_W; gx++) {
          const idx = (gy * GRID_W + gx) * 4;
          // MediaPipeのマスクは赤チャンネル(R)またはAlphaに255が入る
          if (maskData[idx] > 100 || maskData[idx + 3] > 100) {
            if (gx < minX) minX = gx;
            if (gx > maxX) maxX = gx;
          }
        }

        // この行に人物が存在する場合、左右の外側のリアルタイム背景を引き伸ばして埋める
        if (maxX >= minX) {
          const y = gy * scaleY;
          const h = scaleY + 2;
          const personLeft = Math.max(0, (minX - 2) * scaleX);
          const personRight = Math.min(vw, (maxX + 2) * scaleX);
          const personWidth = personRight - personLeft;
          const halfWidth = personWidth / 2;

          // サイン波で光学迷彩のゆらぎを加える
          const wave = Math.sin(gy * 0.35 + waveTime) * 12 * cloakAlpha;

          // 左側の背景（幅40px分）を人物の左半分に引き伸ばして描画
          if (personLeft > 20) {
            const srcX = Math.max(0, personLeft - 45);
            const srcW = personLeft - srcX;
            warpCtx.drawImage(video, srcX, y, srcW, h, personLeft - 5 + wave, y, halfWidth + 10, h);
          } else if (personRight < vw - 20) {
            // 左側が画面端で背景がない場合は右側の背景で全体を埋める
            const srcX = personRight;
            const srcW = Math.min(45, vw - personRight);
            warpCtx.drawImage(video, srcX, y, srcW, h, personLeft + wave, y, personWidth, h);
          }

          // 右側の背景（幅40px分）を人物の右半分に引き伸ばして描画
          if (personRight < vw - 20) {
            const srcX = personRight;
            const srcW = Math.min(45, vw - personRight);
            warpCtx.drawImage(video, srcX, y, srcW, h, personLeft + halfWidth - 5 + wave, y, halfWidth + 10, h);
          } else if (personLeft > 20) {
            const srcX = Math.max(0, personLeft - 45);
            const srcW = personLeft - srcX;
            warpCtx.drawImage(video, srcX, y, srcW, h, personLeft + wave, y, personWidth, h);
          }
        }
      }

      // 引き伸ばした境界を馴染ませるために軽くブラーをかける
      warpCtx.save();
      warpCtx.filter = 'blur(6px)';
      warpCtx.drawImage(warpCanvas, 0, 0);
      warpCtx.restore();
    }

    // 【モード②用】人物から十分に離れた「安全な背景領域」だけをリアルタイム更新する関数
    function updateSmartBackground(vw, vh, maskData) {
      const scaleX = vw / GRID_W;
      const scaleY = vh / GRID_H;

      for (let gy = 0; gy < GRID_H; gy++) {
        for (let gx = 0; gx < GRID_W; gx++) {
          // 周囲1マスを含めて人間が全くいないかチェック（輪郭の映り込みを完全防止）
          let isSafeBg = true;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -2; dx <= 2; dx++) {
              const ny = Math.min(GRID_H - 1, Math.max(0, gy + dy));
              const nx = Math.min(GRID_W - 1, Math.max(0, gx + dx));
              const idx = (ny * GRID_W + nx) * 4;
              if (maskData[idx] > 30 || maskData[idx + 3] > 30) {
                isSafeBg = false;
                break;
              }
            }
            if (!isSafeBg) break;
          }

          // 完全に人間がいない領域だけ、最新のカメラ映像で背景キャンバスを上書きする
          if (isSafeBg) {
            bgCtx.drawImage(
              video,
              gx * scaleX, gy * scaleY, scaleX, scaleY,
              gx * scaleX, gy * scaleY, scaleX, scaleY
            );
          }
        }
      }
    }

    function renderLoop() {
      const vw = canvas.width;
      const vh = canvas.height;
      waveTime += 0.15;

      if (!isProcessingAI && video.readyState >= 2) {
        isProcessingAI = true;
        Promise.all([
          selfieSegmentation.send({ image: video }),
          hands.send({ image: video })
        ]).finally(() => {
          isProcessingAI = false;
        });
      }

      // 透明度の更新（じわーっと変化）
      if (isSquarePose) {
        cloakAlpha = Math.min(1.0, cloakAlpha + FADE_IN_SPEED);
      } else {
        cloakAlpha = Math.max(0.0, cloakAlpha - FADE_OUT_SPEED);
      }

      gaugeBar.style.width = `${cloakAlpha * 100}%`;

      // ベースとなる現在のカメラ映像を描画
      ctx.clearRect(0, 0, vw, vh);
      ctx.drawImage(video, 0, 0, vw, vh);

      if (latestMask) {
        // マスクを縮小キャンバスに描いてピクセルデータを取得（高速解析用）
        smallMaskCtx.clearRect(0, 0, GRID_W, GRID_H);
        smallMaskCtx.drawImage(latestMask, 0, 0, GRID_W, GRID_H);
        const maskData = smallMaskCtx.getImageData(0, 0, GRID_W, GRID_H).data;

        // モード②の場合は、人物がいない安全領域の背景を毎フレーム自動更新
        if (currentMode === 'smart_bg' && bgCaptured) {
          updateSmartBackground(vw, vh, maskData);
        }

        // 透明化エフェクトの描画
        if (cloakAlpha > 0.01) {
          let sourceBgCanvas = bgCanvas;

          if (currentMode === 'warp') {
            // モード①：左右のリアルタイム背景を引き伸ばして空間ワープ画像を生成
            generateRealtimeWarpBg(vw, vh, maskData);
            sourceBgCanvas = warpCanvas;
          } else {
            // モード②：記憶＋自動更新された背景に少しだけ光学迷彩の揺らぎを足す
            warpCtx.clearRect(0, 0, vw, vh);
            const stripH = 10;
            for (let y = 0; y < vh; y += stripH) {
              const wave = Math.sin(y * 0.05 + waveTime) * 4 * cloakAlpha;
              warpCtx.drawImage(bgCanvas, 0, y, vw, stripH, wave, y, vw, stripH);
            }
            sourceBgCanvas = warpCanvas;
          }

          // 人物シルエットの形に切り抜く
          personCtx.clearRect(0, 0, vw, vh);
          personCtx.filter = 'blur(8px)';
          personCtx.drawImage(latestMask, 0, 0, vw, vh);
          personCtx.filter = 'none';

          personCtx.globalCompositeOperation = 'source-in';
          personCtx.drawImage(sourceBgCanvas, 0, 0, vw, vh);
          personCtx.globalCompositeOperation = 'source-over';

          // メイン画面の上に cloakAlpha の不透明度で重ねる（人物が背景で完全に上書きされて消える）
          ctx.save();
          ctx.globalAlpha = cloakAlpha;
          ctx.drawImage(personCanvas, 0, 0, vw, vh);
          ctx.restore();
        }
      }

      // 指の認識マーカーを描画（ポーズが効いているか確認できる視覚ガイド）
      // ※完全に消えた時(cloakAlpha > 0.9)はマーカーも薄くして邪魔にならないようにする
      if (detectedFingerPoints && cloakAlpha < 0.95) {
        ctx.save();
        ctx.strokeStyle = isSquarePose ? '#00e5ff' : 'rgba(255, 255, 0, 0.6)';
        ctx.fillStyle = isSquarePose ? '#00e5ff' : 'rgba(255, 255, 0, 0.6)';
        ctx.lineWidth = 3;

        // 親指・人差し指の4点を結ぶ枠とドットを表示
        detectedFingerPoints.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x * vw, pt.y * vh, 6, 0, Math.PI * 2);
          ctx.fill();
        });

        if (isSquarePose) {
          ctx.beginPath();
          ctx.moveTo(detectedFingerPoints[0].x * vw, detectedFingerPoints[0].y * vh);
          ctx.lineTo(detectedFingerPoints[1].x * vw, detectedFingerPoints[1].y * vh);
          ctx.lineTo(detectedFingerPoints[3].x * vw, detectedFingerPoints[3].y * vh);
          ctx.lineTo(detectedFingerPoints[2].x * vw, detectedFingerPoints[2].y * vh);
          ctx.closePath();
          ctx.stroke();
        }
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    init();
  </script>
</body>
</html>
