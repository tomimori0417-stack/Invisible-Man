<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>光学迷彩・透明マント（タブレット対応版）</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #ui-container {
      width: 92%;
      max-width: 760px;
      margin-top: 10px;
      z-index: 10;
      text-align: center;
      background: rgba(20, 20, 20, 0.9);
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      border: 1px solid #333;
    }
    #status {
      font-size: 15px;
      font-weight: bold;
      color: #00e5ff;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active:not(:disabled) {
      transform: scale(0.97);
    }
    button:disabled {
      background: #444 !important;
      color: #888 !important;
      cursor: not-allowed;
    }
    .btn-bg {
      background: #28a745;
      color: white;
    }
    .btn-timer {
      background: #17a2b8;
      color: white;
    }
    .btn-cam {
      background: #6f42c1;
      color: white;
    }
    .btn-toggle {
      background: #ff9800;
      color: #000;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
      color: #ddd;
      background: rgba(255,255,255,0.06);
      padding: 6px 12px;
      border-radius: 6px;
    }
    input[type="range"] {
      width: 140px;
      accent-color: #00e5ff;
      cursor: pointer;
    }
    #gauge-container {
      margin-top: 8px;
      width: 100%;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    #gauge-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00e5ff, #76ff03);
    }
    canvas {
      width: 96%;
      max-width: 800px;
      height: auto;
      background: #000;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
      margin-top: 10px;
      margin-bottom: 20px;
    }
    /* インカメラの時だけ鏡のように左右反転するクラス */
    canvas.mirror {
      transform: scaleX(-1);
    }
    video {
      display: none;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div id="status">カメラとAIモデルを起動中...</div>

    <div class="btn-row">
      <button id="capture-now-btn" class="btn-bg" disabled>📸 今すぐ背景を保存</button>
      <button id="capture-timer-btn" class="btn-timer" disabled>⏱️ 3秒後に背景を保存</button>
      <button id="switch-cam-btn" class="btn-cam" disabled>🔄 カメラ切替 (現在: イン)</button>
      <button id="toggle-cloak-btn" class="btn-toggle" disabled>✨ 手動で透明ON/OFF</button>
    </div>

    <div class="slider-row">
      <label for="expand-slider">輪郭の拡張（フチ消し幅）: <strong id="expand-val">18</strong>px</label>
      <input type="range" id="expand-slider" min="4" max="40" value="18">
      <label style="margin-left: 8px; cursor: pointer;">
        <input type="checkbox" id="auto-update-chk" checked> 背景の自動学習を併用
      </label>
    </div>

    <div id="gauge-container">
      <div id="gauge-bar"></div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output-canvas" class="mirror"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output-canvas');
    const ctx = canvas.getContext('2d');
    const statusTxt = document.getElementById('status');
    const gaugeBar = document.getElementById('gauge-bar');

    const captureNowBtn = document.getElementById('capture-now-btn');
    const captureTimerBtn = document.getElementById('capture-timer-btn');
    const switchCamBtn = document.getElementById('switch-cam-btn');
    const toggleCloakBtn = document.getElementById('toggle-cloak-btn');
    const expandSlider = document.getElementById('expand-slider');
    const expandVal = document.getElementById('expand-val');
    const autoUpdateChk = document.getElementById('auto-update-chk');

    // オフスクリーンキャンバス
    const cleanBgCanvas = document.createElement('canvas'); // 保存された背景画像
    const cleanBgCtx = cleanBgCanvas.getContext('2d');

    const expandedMaskCanvas = document.createElement('canvas'); // 輪郭を大きく広げたマスク用
    const expandedMaskCtx = expandedMaskCanvas.getContext('2d');

    const personCanvas = document.createElement('canvas'); // 人物シルエット合成用
    const personCtx = personCanvas.getContext('2d');

    const bgHoleCanvas = document.createElement('canvas'); // 自動背景更新用（人間以外を切り抜く）
    const bgHoleCtx = bgHoleCanvas.getContext('2d');

    // 状態管理変数
    let currentFacingMode = 'user'; // 'user'(インカメラ) または 'environment'(アウトカメラ)
    let currentStream = null;
    let bgCaptured = false;
    let cloakActive = false;
    let cloakAlpha = 0.0;
    let expandSize = 18; // 輪郭を広げるピクセル幅

    let latestMask = null;
    let latestHands = [];
    let isProcessingAI = false;
    let poseHoldFrames = 0;
    let cooldownFrames = 0;

    const FADE_SPEED = 0.03; // じわーっと消えるスピード

    // スライダーで輪郭の拡張サイズを変更
    expandSlider.addEventListener('input', (e) => {
      expandSize = parseInt(e.target.value, 10);
      expandVal.innerText = expandSize;
    });

    // 今すぐ背景を保存
    captureNowBtn.addEventListener('click', () => {
      saveBackgroundNow();
    });

    // 3秒タイマーで背景を保存
    captureTimerBtn.addEventListener('click', () => {
      let count = 3;
      captureNowBtn.disabled = true;
      captureTimerBtn.disabled = true;
      const timer = setInterval(() => {
        if (count > 0) {
          statusTxt.innerText = `⏱️ 背景保存まであと ${count} 秒...（カメラの前から避けてください！）`;
          count--;
        } else {
          clearInterval(timer);
          saveBackgroundNow();
          captureNowBtn.disabled = false;
          captureTimerBtn.disabled = false;
        }
      }, 1000);
    });

    function saveBackgroundNow() {
      cleanBgCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
      bgCaptured = true;
      statusTxt.innerText = "✅ 背景を保存しました！両手で「四角形」を作ると透明になります";
    }

    // 手動で透明ON/OFF切替
    toggleCloakBtn.addEventListener('click', () => {
      if (!bgCaptured) {
        saveBackgroundNow();
      }
      cloakActive = !cloakActive;
    });

    // インカメラ / アウトカメラ切替
    switchCamBtn.addEventListener('click', async () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      const camLabel = (currentFacingMode === 'user') ? 'イン' : 'アウト';
      switchCamBtn.innerText = `🔄 カメラ切替 (現在: ${camLabel})`;

      // インカメラの時は鏡表示、アウトカメラの時は正像表示
      if (currentFacingMode === 'user') {
        canvas.classList.add('mirror');
      } else {
        canvas.classList.remove('mirror');
      }

      bgCaptured = false;
      cloakActive = false;
      cloakAlpha = 0.0;
      statusTxt.innerText = `${camLabel}カメラに切り替えています...`;
      await startCamera(currentFacingMode);
      statusTxt.innerText = "カメラが切り替わりました。誰もいない状態で「背景を保存」を押してください";
    });

    function getDistance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 1. MediaPipe 人物切り抜き
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });
    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults((results) => {
      latestMask = results.segmentationMask;
    });

    // 2. MediaPipe 手の骨格検出
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults((results) => {
      latestHands = results.multiHandLandmarks || [];
    });

    // カメラストリームの起動・再起動
    async function startCamera(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      };

      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      await video.play();

      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      [canvas, cleanBgCanvas, expandedMaskCanvas, personCanvas, bgHoleCanvas].forEach(c => {
        c.width = vw;
        c.height = vh;
      });
    }

    async function init() {
      try {
        await startCamera(currentFacingMode);

        statusTxt.innerText = "AIモデルを準備しています...";
        await selfieSegmentation.send({ image: video });
        await hands.send({ image: video });

        captureNowBtn.disabled = false;
        captureTimerBtn.disabled = false;
        switchCamBtn.disabled = false;
        toggleCloakBtn.disabled = false;

        statusTxt.innerText = "【ステップ1】誰もいない風景を映し、「背景を保存」を押してください";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        statusTxt.style.color = "#ff5252";
        statusTxt.innerText = `カメラ起動エラー: ${err.message}`;
      }
    }

    // 人物マスクの輪郭をグッと広げる関数（体のフチが残るのを防ぐ）
    function createExpandedMask(sourceMask, vw, vh, radius) {
      expandedMaskCtx.clearRect(0, 0, vw, vh);
      // ぼかしをかけて一回り大きくする
      expandedMaskCtx.filter = `blur(${Math.max(4, Math.floor(radius * 0.6))}px)`;

      // 中心と周囲8方向にずらして重ね描きし、マスク領域を確実に太らせる（膨張処理）
      expandedMaskCtx.drawImage(sourceMask, 0, 0, vw, vh);
      const dirs = [
        [1, 0], [-1, 0], [0, 1], [0, -1],
        [0.7, 0.7], [-0.7, 0.7], [0.7, -0.7], [-0.7, -0.7]
      ];
      for (const [dx, dy] of dirs) {
        expandedMaskCtx.drawImage(sourceMask, dx * radius, dy * radius, vw, vh);
      }
      expandedMaskCtx.filter = 'none';
    }

    function renderLoop() {
      const vw = canvas.width;
      const vh = canvas.height;

      // AI推論を非同期実行
      if (!isProcessingAI && video.readyState >= 2) {
        isProcessingAI = true;
        Promise.all([
          selfieSegmentation.send({ image: video }),
          hands.send({ image: video })
        ]).finally(() => {
          isProcessingAI = false;
        });
      }

      // --- 四角形ポーズの判定 ---
      let isPoseNow = false;
      if (latestHands.length >= 2) {
        const h1 = latestHands[0];
        const h2 = latestHands[1];

        const cross1 = getDistance(h1[4], h2[8]);
        const cross2 = getDistance(h1[8], h2[4]);
        const para1 = getDistance(h1[4], h2[4]);
        const para2 = getDistance(h1[8], h2[8]);

        const th = 0.16;
        if ((cross1 < th && cross2 < th) || (para1 < th && para2 < th)) {
          isPoseNow = true;
        }
      }

      if (cooldownFrames > 0) cooldownFrames--;

      // 背景保存後に四角形ポーズをとったら透明化ON/OFFをトグル
      if (bgCaptured && isPoseNow && cooldownFrames === 0) {
        poseHoldFrames++;
        if (poseHoldFrames > 6) {
          cloakActive = !cloakActive;
          poseHoldFrames = 0;
          cooldownFrames = 45; // 1.5秒間は連続切替を防止
          statusTxt.innerText = cloakActive
            ? "✨ 光学迷彩発動中！（もう一度ポーズをとるかボタンで解除）"
            : "解除しました。四角形ポーズで再び透明になります";
        }
      } else {
        poseHoldFrames = Math.max(0, poseHoldFrames - 1);
      }

      // 透明度のアニメーション更新（じわーっと変化）
      if (cloakActive && bgCaptured) {
        cloakAlpha = Math.min(1.0, cloakAlpha + FADE_SPEED);
      } else {
        cloakAlpha = Math.max(0.0, cloakAlpha - FADE_SPEED);
      }
      gaugeBar.style.width = `${cloakAlpha * 100}%`;

      // --- 拡張マスクの生成と自動背景学習 ---
      if (latestMask && bgCaptured) {
        // 設定されたピクセル幅(expandSize)だけ人物の輪郭を大きく広げる
        createExpandedMask(latestMask, vw, vh, expandSize);

        // 「背景の自動学習」がONの時は、広げた人物領域のさらに外側の綺麗な背景だけを少しずつ更新
        if (autoUpdateChk.checked) {
          bgHoleCtx.clearRect(0, 0, vw, vh);
          bgHoleCtx.drawImage(video, 0, 0, vw, vh);
          bgHoleCtx.globalCompositeOperation = 'destination-out';
          // 人物のフチが背景に混ざらないよう、拡張マスクを2回重ねて確実にくり抜く
          bgHoleCtx.drawImage(expandedMaskCanvas, 0, 0, vw, vh);
          bgHoleCtx.drawImage(expandedMaskCanvas, 0, 0, vw, vh);
          bgHoleCtx.globalCompositeOperation = 'source-over';

          cleanBgCtx.drawImage(bgHoleCanvas, 0, 0, vw, vh);
        }
      }

      // --- メイン画面の描画 ---
      ctx.clearRect(0, 0, vw, vh);
      ctx.drawImage(video, 0, 0, vw, vh);

      if (cloakAlpha > 0.01 && latestMask && bgCaptured) {
        personCtx.clearRect(0, 0, vw, vh);

        // 大きく広げたマスクを描画（輪郭が濃いめになるよう2回重ねて中心部を100%不透明にする）
        personCtx.drawImage(expandedMaskCanvas, 0, 0, vw, vh);
        personCtx.drawImage(expandedMaskCanvas, 0, 0, vw, vh);

        // 広げたマスクの内側に、保存しておいた綺麗な背景を流し込む
        personCtx.globalCompositeOperation = 'source-in';
        personCtx.drawImage(cleanBgCanvas, 0, 0, vw, vh);
        personCtx.globalCompositeOperation = 'source-over';

        // 現在の透明度(cloakAlpha)でカメラ映像の上にじわーっと重ねる
        ctx.save();
        ctx.globalAlpha = cloakAlpha;
        ctx.drawImage(personCanvas, 0, 0, vw, vh);
        ctx.restore();
      }

      // 指先の認識ガイド（透明になる前のみ小さく表示）
      if (latestHands.length > 0 && cloakAlpha < 0.85) {
        ctx.save();
        for (const hand of latestHands) {
          [4, 8].forEach(idx => {
            const pt = hand[idx];
            ctx.beginPath();
            ctx.arc(pt.x * vw, pt.y * vh, 7, 0, Math.PI * 2);
            ctx.fillStyle = isPoseNow ? '#76ff03' : 'rgba(0, 229, 255, 0.75)';
            ctx.fill();
          });
        }
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }

    init();
  </script>
</body>
</html>
